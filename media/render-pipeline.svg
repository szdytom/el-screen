<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">Morrow EL-320 渲染数据流</title>
  <desc id="desc">页面以30赫兹绘制到R8灰度纹理，驱动阶段按72赫兹模拟行寻址并交替更新RGBA8历史纹理，半分辨率光晕经过水平与垂直两遍滤波，最终与丝印和机壳参数合成到窗口。</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1">
      <stop stop-color="#17191d"/>
      <stop offset="1" stop-color="#101214"/>
    </linearGradient>
    <linearGradient id="amber" x2="1" y2="1">
      <stop stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#e87524"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#b9a88f"/>
    </marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#eee9df}
      .muted{fill:#a9a69f}.faint{fill:#777a7d}.amber{fill:#ffbd62}.blue{fill:#8bc6d9}
      .title{font-size:30px;font-weight:600}.subtitle{font-size:16px}.label{font-size:18px;font-weight:600}.body{font-size:15px}.small{font-size:13px}
      .card{fill:#202328;stroke:#3b3e43;stroke-width:1.5}.line{stroke:#b9a88f;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#777a7d;stroke-width:1.5;stroke-dasharray:6 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="680" fill="url(#bg)"/>
  <text x="48" y="55" class="title">从目标灰度到最终画面</text>
  <text x="48" y="84" class="subtitle muted">页面内容、驱动历史与光学外观分别更新，最后在一个片元着色器中汇合</text>

  <rect x="48" y="112" width="1184" height="62" rx="12" fill="#1c1f23" stroke="#34383d"/>
  <text x="72" y="138" class="small muted">页面时钟</text><text x="72" y="160" class="label amber">30 Hz</text>
  <path d="M244 124V162M540 124V162M836 124V162" stroke="#34383d"/>
  <text x="268" y="138" class="small muted">模拟行寻址</text><text x="268" y="160" class="label blue">72 Hz</text>
  <text x="564" y="138" class="small muted">历史与最终合成</text><text x="564" y="160" class="label">随主循环，≤ 120 Hz</text>
  <text x="860" y="138" class="small muted">慢放</text><text x="860" y="160" class="body">缩放同一个演示时钟</text>

  <rect x="48" y="214" width="250" height="260" rx="16" class="card"/>
  <text x="72" y="250" class="label">1 · 页面绘制</text>
  <text x="72" y="275" class="small muted">pages.c + raster.c · CPU</text>
  <rect x="72" y="302" width="138" height="104" rx="3" fill="#111315" stroke="#53575a"/>
  <g fill="#d58a38">
    <rect x="80" y="311" width="122" height="3" opacity=".35"/>
    <rect x="80" y="322" width="56" height="5" opacity=".8"/>
    <path d="M80 365L91 349L101 357L112 337L124 354L136 343L148 360L160 332L173 351L185 342L200 348" fill="none" stroke="#f0a34d" stroke-width="2"/>
    <g opacity=".45"><rect x="82" y="379" width="10" height="15"/><rect x="98" y="373" width="10" height="21"/><rect x="114" y="382" width="10" height="12"/><rect x="130" y="368" width="10" height="26"/><rect x="146" y="376" width="10" height="18"/><rect x="162" y="371" width="10" height="23"/></g>
  </g>
  <text x="72" y="435" class="body">320 × 240 · 单通道灰度</text>
  <text x="72" y="458" class="small muted">另统计页面平均负载</text>

  <rect x="358" y="214" width="264" height="260" rx="16" class="card"/>
  <text x="382" y="250" class="label">2 · 驱动与历史</text>
  <text x="382" y="275" class="small muted">drive.frag · GPU</text>
  <rect x="382" y="304" width="94" height="66" rx="7" fill="#292d31" stroke="#67717a"/>
  <rect x="502" y="304" width="94" height="66" rx="7" fill="#292d31" stroke="#d69a51"/>
  <text x="429" y="331" text-anchor="middle" class="small muted">front</text><text x="429" y="352" text-anchor="middle" class="body">读取</text>
  <text x="549" y="331" text-anchor="middle" class="small amber">back</text><text x="549" y="352" text-anchor="middle" class="body">写入</text>
  <path d="M477 321H500M501 357H478" stroke="#a9a69f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="382" y="402" class="body">RGBA8 · 320 × 240</text>
  <text x="382" y="427" class="small muted">R 驱动 · G 余辉 · B 上升亏欠</text>
  <text x="382" y="450" class="small muted">A 曝光记忆；每帧交换前后纹理</text>

  <rect x="682" y="214" width="230" height="260" rx="16" class="card"/>
  <text x="706" y="250" class="label">3 · 双尺度光晕</text>
  <text x="706" y="275" class="small muted">bloom.frag · GPU</text>
  <rect x="706" y="307" width="78" height="58" rx="6" fill="#292d31" stroke="#67717a"/>
  <rect x="810" y="307" width="78" height="58" rx="6" fill="#292d31" stroke="#67717a"/>
  <text x="745" y="342" text-anchor="middle" class="body">水平 →</text><text x="849" y="342" text-anchor="middle" class="body">垂直 ↓</text>
  <path d="M785 336H808" class="line"/>
  <text x="706" y="400" class="body">RG8 · 160 × 120</text>
  <text x="706" y="427" class="small muted">R：近处散射，填补点间缝隙</text>
  <text x="706" y="450" class="small muted">G：宽光晕，形成外围辉光</text>

  <rect x="972" y="214" width="260" height="260" rx="16" class="card"/>
  <text x="996" y="250" class="label">4 · 最终合成</text>
  <text x="996" y="275" class="small muted">panel.frag · GPU</text>
  <rect x="996" y="302" width="212" height="112" rx="12" fill="#35383a" stroke="#666764"/>
  <rect x="1010" y="314" width="184" height="76" rx="5" fill="#21170f" stroke="#80552d"/>
  <g filter="url(#glow)" fill="url(#amber)">
    <circle cx="1040" cy="350" r="3"/><circle cx="1050" cy="350" r="3"/><circle cx="1060" cy="350" r="3"/><circle cx="1070" cy="350" r="3"/>
    <path d="M1090 359L1102 338L1115 354L1128 331L1140 348L1152 340L1174 352" fill="none" stroke="#ffad45" stroke-width="2"/>
  </g>
  <text x="996" y="439" class="body">点孔径 · 玻璃 · 暗带 · 机壳</text>
  <text x="996" y="461" class="small muted">曝光、色调映射与显示伽马</text>

  <path d="M299 344H355" class="line"/><path d="M623 344H679" class="line"/><path d="M913 344H969" class="line"/>
  <text x="327" y="329" text-anchor="middle" class="small muted">上传</text><text x="651" y="329" text-anchor="middle" class="small muted">采样</text><text x="941" y="329" text-anchor="middle" class="small muted">合成</text>

  <rect x="48" y="524" width="1184" height="104" rx="14" fill="#191c1f" stroke="#34383d"/>
  <text x="72" y="555" class="label">并行输入</text>
  <text x="72" y="584" class="body muted">main.c 提供相位、步长、电源、电压、亮度、负载和暗带位置</text>
  <text x="72" y="609" class="small faint">丝印纹理在初始化时生成；页面纹理只在页面重绘时上传，历史与光学阶段仍可继续逐帧更新。</text>
  <path d="M808 524V484" class="dash"/><path d="M1102 524V477" class="dash"/>
</svg>
